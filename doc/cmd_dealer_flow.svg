<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860">
  <rect x="0" y="0" width="1200" height="860" fill="#ffffff"/>
  <text x="600" y="36" text-anchor="middle" font-size="22" font-weight="600" font-family="Arial" fill="#111">
    DragonTigerWS (Mock Dealer) ⇄ pydealerclient — Command Flow
  </text>
  <text x="600" y="58" text-anchor="middle" font-size="12" font-family="Arial" fill="#666">
    Directions: Gray = Dealer➜Client, Blue = Client➜Dealer.
  </text>

  <!-- Swimlanes -->
  <rect x="50"  y="72" width="300" height="38" rx="8" ry="8" fill="#f0f7ff" stroke="#86b7fe"/>
  <text x="200" y="98" text-anchor="middle" font-size="16" font-weight="600" font-family="Arial" fill="#0b5ed7">
    Dealer UI / WS (DragonTigerWS)
  </text>
  <rect x="850" y="72" width="300" height="38" rx="8" ry="8" fill="#f6f6f6" stroke="#c9c9c9"/>
  <text x="1000" y="98" text-anchor="middle" font-size="16" font-weight="600" font-family="Arial" fill="#222">
    pydealerclient
  </text>

  <!-- Lifelines -->
  <line x1="200" y1="130" x2="200" y2="800" stroke="#86b7fe" stroke-dasharray="6,6" stroke-width="2"/>
  <line x1="1000" y1="130" x2="1000" y2="800" stroke="#c9c9c9" stroke-dasharray="6,6" stroke-width="2"/>

  <!-- TCP CONNECT -->
  <line x1="200" y1="160" x2="1000" y2="160" stroke="#6c757d" stroke-width="2" stroke-dasharray="6,6"/>
  <polygon points="1000,160 990,154 990,166" fill="#6c757d"/>
  <text x="600" y="148" text-anchor="middle" font-size="14" font-family="Arial" fill="#6c757d">TCP CONNECT</text>
  <text x="600" y="176" text-anchor="middle" font-size="12" font-family="Arial" fill="#555">Client connects; WS accepts</text>

  <!-- Dealer→Client: CMD_LOGIN(svrid) -->
  <line x1="200" y1="220" x2="1000" y2="220" stroke="#6c757d" stroke-width="2"/>
  <polygon points="1000,220 990,214 990,226" fill="#6c757d"/>
  <text x="600" y="208" text-anchor="middle" font-size="14" font-family="Arial" fill="#6c757d">CMD_LOGIN(svrid)</text>
  <text x="600" y="236" text-anchor="middle" font-size="12" font-family="Arial" fill="#555">Server→Client login packet (no gmcode)</text>

  <!-- Client→Dealer: CMD_LOGIN_R -->
  <line x1="1000" y1="280" x2="200" y2="280" stroke="#0d6efd" stroke-width="2"/>
  <polygon points="200,280 210,274 210,286" fill="#0d6efd"/>
  <text x="600" y="268" text-anchor="middle" font-size="14" font-family="Arial" fill="#0d6efd">CMD_LOGIN_R(status_code, gmtype, vid)</text>
  <text x="600" y="296" text-anchor="middle" font-size="12" font-family="Arial" fill="#555">Client→Server session OK</text>

  <!-- Dealer→Client: CMD_START_PREDICT -->
  <line x1="200" y1="340" x2="1000" y2="340" stroke="#6c757d" stroke-width="2"/>
  <polygon points="1000,340 990,334 990,346" fill="#6c757d"/>
  <text x="600" y="328" text-anchor="middle" font-size="14" font-family="Arial" fill="#6c757d">CMD_START_PREDICT(gmcode, gmstate)</text>
  <text x="600" y="356" text-anchor="middle" font-size="12" font-family="Arial" fill="#555">Enter RUN; set round code</text>

  <text x="600" y="385" text-anchor="middle" font-size="12" font-family="Arial" fill="#198754">For each index N (e.g., 1..3)</text>

  <!-- Dealer→Client: CMD_DISPATCH_INDEX -->
  <line x1="200" y1="410" x2="1000" y2="410" stroke="#6c757d" stroke-width="2"/>
  <polygon points="1000,410 990,404 990,416" fill="#6c757d"/>
  <text x="600" y="398" text-anchor="middle" font-size="14" font-family="Arial" fill="#6c757d">CMD_DISPATCH_INDEX(gmcode, index=N)</text>
  <text x="600" y="426" text-anchor="middle" font-size="12" font-family="Arial" fill="#555">Client marks t₁ (dispatch recv)</text>

  <!-- Client→Dealer: CMD_PREDICT_RESULT -->
  <line x1="1000" y1="470" x2="200" y2="470" stroke="#0d6efd" stroke-width="2"/>
  <polygon points="200,470 210,464 210,476" fill="#0d6efd"/>
  <text x="600" y="458" text-anchor="middle" font-size="14" font-family="Arial" fill="#0d6efd">
    CMD_PREDICT_RESULT(gmcode, count, [index,classid,score])
  </text>
  <text x="600" y="486" text-anchor="middle" font-size="12" font-family="Arial" fill="#555">
    Client sends result; marks t₂; logs Δ = t₂ − t₁
  </text>

  <!-- Dealer→Client: CMD_SAVE_RESULT -->
  <line x1="200" y1="530" x2="1000" y2="530" stroke="#6c757d" stroke-width="2"/>
  <polygon points="1000,530 990,524 990,536" fill="#6c757d"/>
  <text x="600" y="518" text-anchor="middle" font-size="14" font-family="Arial" fill="#6c757d">CMD_SAVE_RESULT(gmcode)</text>
  <text x="600" y="546" text-anchor="middle" font-size="12" font-family="Arial" fill="#555">Finalize round</text>

  <!-- Dealer→Client: CMD_STOP_PREDICT -->
  <line x1="200" y1="590" x2="1000" y2="590" stroke="#6c757d" stroke-width="2"/>
  <polygon points="1000,590 990,584 990,596" fill="#6c757d"/>
  <text x="600" y="578" text-anchor="middle" font-size="14" font-family="Arial" fill="#6c757d">CMD_STOP_PREDICT(gmcode, gmstate)</text>

  <!-- Keepalive (bi-directional) -->
  <!-- Client→Dealer PING (always on client) -->
  <line x1="1000" y1="720" x2="200" y2="720" stroke="#0d6efd" stroke-width="2" stroke-dasharray="6,6"/>
  <polygon points="200,720 210,714 210,726" fill="#0d6efd"/>
  <text x="600" y="708" text-anchor="middle" font-size="14" font-family="Arial" fill="#0d6efd">KEEPALIVE: Client→Dealer (PING)</text>

  <!-- Dealer→Client PONG (optional on real dealer; mock dealer does not send) -->
  <line x1="200" y1="744" x2="1000" y2="744" stroke="#6c757d" stroke-width="2" stroke-dasharray="6,6"/>
  <polygon points="1000,744 990,738 990,750" fill="#6c757d"/>
  <text x="600" y="735" text-anchor="middle" font-size="14" font-family="Arial" fill="#6c757d">
    KEEPALIVE: Dealer→Client (PONG) — Optional 
  </text>

  <!-- Legend -->
  <rect x="40" y="790" width="1120" height="40" rx="8" ry="8" fill="#fff8e5" stroke="#ffd66b"/>
  <text x="60" y="814" font-size="12" font-family="Arial" fill="#7a5d00">
    Gray = Dealer➜Client. Blue = Client➜Dealer.
  </text>
</svg>
